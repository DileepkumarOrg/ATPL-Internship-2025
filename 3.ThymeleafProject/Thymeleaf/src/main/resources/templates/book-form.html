<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="container mt-4">

      <div class="d-flex align-items-center mb-3">
            <a th:href="@{/books}" class="me-2 text-dark" title="Back">
                  <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h2>Add / Edit Book</h2>
      </div>

      <form th:action="@{/books/save}" th:object="${book}" method="post">

             <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                  <label>Title</label>
                  <input class="form-control" th:value="${book.title}" th:field="*{title}">
                  <p class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div class="mb-3">
                  <label>Author</label>
                  <input class="form-control" th:field="*{author}">
                  <p class="text-danger" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></p>
            </div>

            <div class="mb-3">
                  <label>Price</label>
                  <input class="form-control" th:field="*{price}">
                  <p class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
            </div>

            <div class="mb-3">
                  <label>Description</label>
                  <input type="text" class="form-control" th:field="*{description}">
                  <p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
            </div>

            <button class="btn btn-success">Save</button>

      </form>
      
      <!-- <div class="h-3 w-3 bg-red-800 rounded p-20 m-10">
      </div> -->

</body>

</html>
