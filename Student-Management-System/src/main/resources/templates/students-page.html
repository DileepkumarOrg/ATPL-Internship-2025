<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
      <div class="container mt-5">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-3xl font-bold mb-4">Students List</h1>
            <a href="/addStudent" class="btn btn-success mb-3"><i class="fas fa-plus"></i> Add Student</a>
        </div>
        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Age</th>
              <th>Grade</th>
              <th>Phone</th>
              <th>Branch</th>
              <th>Section</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Example student data -->
            <tr th:each="student : ${students}">
              <td th:text="${student.roll}"></td>
              <td th:text="${student.name}"></td>
              <td th:text="${student.age}"></td>
              <td th:text="${student.grade}"></td>
              <td th:text="${student.phone}"></td>
              <td th:text="${student.branch}"></td>
              <td th:text="${student.section}"></td>
              <td>
                <a th:href="@{/editStudent/{id}(id=${student.roll})}" class="btn btn-sm btn-primary">Edit</a>
                <a th:href="@{/deleteStudent/{id}(id=${student.roll})}" class="btn btn-sm btn-danger">Delete</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

</body>
</html>
