<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
      <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
      <form action="/saveStudent" th:object="${student}" method="post">
    <div class="container mt-5">
        <h1 class="text-3xl font-bold mb-4">Add Student</h1>
        <div class="mb-3">
            <label for="roll" th:if="${student.roll != 0}" class="form-label">Roll Number</label>
            <input type="text" th:if="${student.roll != 0}" disabled class="form-control" id="roll" placeholder="Enter roll number" th:field="*{roll}">
            <input type="hidden" th:if="${student.roll != 0}"  class="form-control" id="roll" placeholder="Enter roll number" th:field="*{roll}">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter name" th:field="*{name}">
            <p class="text-red-800" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control" id="age" placeholder="Enter age" th:field="*{age}">
            <p class="text-red-800" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></p> 
            <label for="grade" class="form-label">Grade</label>
            <input type="text" class="form-control" id="grade" placeholder="Enter grade" th:field="*{grade}">
            <p class="text-red-800" th:if="${#fields.hasErrors('grade')}" th:errors="*{grade}"></p>
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" placeholder="Enter phone number" th:field="*{phone}">
            <p class="text-red-800" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
            <label for="branch" class="form-label">Branch</label>
            <!-- <input type="text" class="form-control" id="branch" placeholder="Enter branch" th:field="*{branch}"> -->
             <select class="form-select" id="branch" th:field="*{branch}">
                <option selected value="">Select branch</option>
                <option th:each="branch : ${branches}" th:value="${branch}" th:text="${branch}"></option>
            </select>
            <p class="text-red-800" th:if="${#fields.hasErrors('branch')}" th:errors="*{branch}"></p>
            <label for="section" class="form-label">Section</label>
            <input type="text" class="form-control" id="section" placeholder="Enter section" th:field="*{section}">
            <p class="text-red-800" th:if="${#fields.hasErrors('section')}" th:errors="*{section}"></p>
        </div>
        <div class="flex justify-end">
            <button type="submit" class="btn btn-secondary me-2">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>

</body>
</html>
